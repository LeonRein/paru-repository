name: build-repo

# Builds every PKGBUILD in an Arch container and force-pushes the resulting
# packages plus the pacman database to the orphan `repo` branch, which is what
# pacman.conf points at. The branch is rewritten rather than appended to, so
# git history never accumulates old binary packages.

on:
  push:
    branches: ['**']
    paths:
      - 'pkgbuilds/**'
      - 'scripts/**'
      - '.github/workflows/build-repo.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-repo
  cancel-in-progress: false

env:
  REPO_NAME: leonrein
  PUBLISH_BRANCH: repo

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: archlinux:base-devel

    steps:
      - name: Install tooling
        # git is needed before checkout so the action clones instead of falling
        # back to a tarball download.
        run: |
          pacman -Syu --noconfirm --needed git python

      - uses: actions/checkout@v4

      - name: Prepare an unprivileged build user
        # makepkg refuses to run as root, and the container runs as root.
        run: |
          useradd -m builder
          printf 'builder ALL=(ALL) NOPASSWD: ALL\n' > /etc/sudoers.d/builder
          chown -R builder:builder "$GITHUB_WORKSPACE"
          git config --system --add safe.directory "$GITHUB_WORKSPACE"

      - name: Check .SRCINFO is in sync with each PKGBUILD
        shell: bash
        run: |
          status=0
          for dir in pkgbuilds/*/; do
            [ -f "$dir/.SRCINFO" ] || continue
            # makepkg insists on the PKGBUILD being in the current directory,
            # so cd into each package rather than using -p.
            if ! ( cd "$dir" && sudo -u builder makepkg --printsrcinfo ) \
                 | diff -u "$dir/.SRCINFO" - ; then
              echo "::error file=${dir}.SRCINFO::out of date, regenerate with: (cd $dir && makepkg --printsrcinfo > .SRCINFO)"
              status=1
            fi
          done
          exit $status

      - name: Build packages and repository database
        run: sudo -u builder --preserve-env=REPO_NAME bash scripts/build-repo.sh

      - name: Summarise
        run: |
          {
            echo '### Packages'
            echo '```'
            ls -1sh x86_64/
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: packages
          path: x86_64/
          if-no-files-found: error

      - name: Publish to the ${{ env.PUBLISH_BRANCH }} branch
        run: |
          set -eu
          publish="$(mktemp -d)"
          cp -a x86_64 "$publish/x86_64"

          # A README on the branch, so someone landing there knows what it is.
          cat > "$publish/README.md" <<'MD'
          # Package repository

          Generated by the `build-repo` workflow. Do not commit here by hand:
          this branch is force-pushed on every build and any manual commit is
          lost. Sources live on the default branch.
          MD

          cd "$publish"
          git init -q -b "$PUBLISH_BRANCH"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -q -m "Publish $REPO_NAME repository from ${GITHUB_SHA:0:12}"
          git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"

          # Retry: pushing a few MB of packages occasionally trips on transient
          # network errors, and a failed publish leaves the repo db stale.
          for delay in 2 4 8 16 0; do
            if git push -f origin "$PUBLISH_BRANCH"; then exit 0; fi
            if [ "$delay" -eq 0 ]; then break; fi
            echo "push failed, retrying in ${delay}s"
            sleep "$delay"
          done
          echo "::error::failed to push the $PUBLISH_BRANCH branch"
          exit 1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
