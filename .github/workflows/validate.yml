name: validate

# Builds every PKGBUILD exactly the way paru will on a user's machine, so a bad
# checksum, a moved release asset or a broken package() is caught here rather
# than on the first `paru -S`.

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    container:
      image: archlinux:base-devel

    steps:
      - name: Install tooling
        # git before checkout, so the action clones instead of falling back to
        # a tarball download.
        run: pacman -Syu --noconfirm --needed git namcap

      - uses: actions/checkout@v4

      - name: Prepare an unprivileged build user
        # makepkg refuses to run as root, and the container runs as root.
        run: |
          useradd -m builder
          printf 'builder ALL=(ALL) NOPASSWD: ALL\n' > /etc/sudoers.d/builder
          chown -R builder:builder "$GITHUB_WORKSPACE"
          git config --system --add safe.directory "$GITHUB_WORKSPACE"

      - name: Check .SRCINFO is in sync with each PKGBUILD
        shell: bash
        run: |
          status=0
          for dir in */; do
            [ -f "$dir/PKGBUILD" ] || continue
            [ -f "$dir/.SRCINFO" ] || { echo "::error::${dir}.SRCINFO is missing"; status=1; continue; }
            # makepkg insists on the PKGBUILD being in the current directory,
            # so cd into each package rather than using -p.
            if ! ( cd "$dir" && sudo -u builder makepkg --printsrcinfo ) \
                 | diff -u "$dir/.SRCINFO" - ; then
              echo "::error file=${dir}.SRCINFO::out of date, regenerate with: (cd $dir && makepkg --printsrcinfo > .SRCINFO)"
              status=1
            fi
          done
          exit $status

      - name: Build every package
        shell: bash
        run: |
          for dir in */; do
            [ -f "$dir/PKGBUILD" ] || continue
            echo "::group::makepkg $dir"
            ( cd "$dir" && sudo -u builder makepkg --syncdeps --noconfirm --cleanbuild --force )
            echo '::endgroup::'
          done

      - name: Lint
        shell: bash
        run: |
          # Informational: namcap warnings are advisory, so they do not fail the
          # run, but they are worth reading in the log.
          for dir in */; do
            [ -f "$dir/PKGBUILD" ] || continue
            ( cd "$dir" && namcap PKGBUILD && namcap ./*.pkg.tar.zst ) || true
          done

      - name: Verify the built package installs the theme correctly
        shell: bash
        run: |
          pkg=$(echo transparent-xcursor-theme/*.pkg.tar.zst)
          root=$(mktemp -d)
          bsdtar -C "$root" -xf "$pkg"

          cursors="$root/usr/share/icons/transparent/cursors"
          test -f "$root/usr/share/icons/transparent/index.theme"
          test -f "$cursors/default" && test ! -L "$cursors/default"
          test -L "$cursors/left_ptr"
          test -f "$root/usr/share/licenses/transparent-xcursor-theme/LICENSE"

          # The aliases must survive packaging as symlinks; expanded into real
          # files this theme would be ~20 MB instead of ~150 KB.
          links=$(find "$cursors" -type l | wc -l)
          [ "$links" -ge 150 ] || { echo "::error::only $links symlinks survived packaging"; exit 1; }

          # A fully transparent cursor is all zero pixels, so every non-zero byte
          # comes from an Xcursor header. Any real artwork would blow past this.
          nonzero=$(LC_ALL=C tr -d '\000' < "$cursors/default" | wc -c)
          [ "$nonzero" -le 1024 ] || { echo "::error::$nonzero non-zero bytes, cursor is not transparent"; exit 1; }

          echo "OK: $(ls -1 "$cursors" | wc -l) cursor names, $links symlinks, $nonzero non-zero bytes"
